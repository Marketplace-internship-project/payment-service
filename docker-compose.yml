version: '3.8'

services:

  app:
    build: .
    container_name: payment-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - EXTERNAL_BANK_API=${EXTERNAL_BANK_API}
    depends_on:
      mongo-db:
        condition: service_healthy

  mongo-db:
    image: mongo:7.0
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s